name: screenshots

# Screenshot reali dell'app (emulatore Android 14) in tutte le lingue, come artifact.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: APK di debug (edizione standard)
        run: ./gradlew --no-daemon assembleStandardDebug

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/screenshots/capture.sh "$PWD/app/build/outputs/apk/standard/debug/app-standard-debug.apk" "$PWD/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

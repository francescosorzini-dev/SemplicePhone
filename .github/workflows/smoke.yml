name: smoke

# Prova su emulatore (Android 14) di funzioni che i test unitari non coprono; risultati sul ramo «smoke».
on:
  workflow_dispatch:
  # Anche con un push sul ramo «smoke-run» (il dispatch funziona solo dal ramo principale).
  push:
    branches: [smoke-run]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: APK di debug (edizione completa)
        run: ./gradlew --no-daemon assembleCompletoDebug

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/screenshots/smoke.sh "$PWD/app/build/outputs/apk/completo/debug/app-completo-debug.apk" "$PWD/shots"

      # Ramo «smoke» (sovrascritto a ogni esecuzione).
      - name: Pubblica sul ramo screenshots
        if: always()
        run: |
          cd shots
          git init -q -b smoke
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "smoke $GITHUB_SHA" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug (due edizioni) + unit test + release (R8, non firmata)
        run: ./gradlew --no-daemon assembleDebug testStandardDebugUnitTest assembleRelease

      - name: Portale PHP (sintassi e lingue)
        run: |
          php -l tools/remote-server/index.php
          cp tools/remote-server/index.php /tmp/portal.php
          php tools/remote-server/embed-langs.php /tmp/portal.php tools/remote-server/lang
          php -l /tmp/portal.php

      - uses: actions/upload-artifact@v4
        with:
          name: SemplicePhone-debug-${{ github.sha }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

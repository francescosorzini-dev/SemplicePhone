name: release

# Tag vX.Y.Z → APK release firmati, AAB per Google Play, update.json e index.php in una GitHub Release.
# La versione sta in app/build.gradle.kts (versionName/versionCode): va aggiornata prima.
# Secrets richiesti: SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# (vedi tools/release/new-keystore.ps1).
on:
  push:
    tags: ['v*']
  # Avvio manuale (anche via API): il tag viene creato da GitHub insieme alla Release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione, es. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versione e tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "::error::versione non valida: $V"; exit 1; }
          SRC=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "$SRC" = "$V" ] || { echo "::error::versionName in app/build.gradle.kts è $SRC, non $V: aggiornalo (e versionCode +10) prima della release"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      # Build riproducibile (requisito di F-Droid per pubblicare con la nostra firma): la stessa
      # edizione completa, non firmata, compilata da un'altra cartella deve risultare identica.
      - name: Build di controllo per la riproducibilità
        run: |
          git clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repro"
          cd "$RUNNER_TEMP/repro"
          ./gradlew --no-daemon --max-workers=2 assembleCompletoRelease
          cp app/build/outputs/apk/completo/release/app-completo-release-unsigned.apk "$RUNNER_TEMP/repro-unsigned.apk"

      - name: Keystore
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret SIGNING_KEYSTORE_B64 mancante (tools/release/new-keystore.ps1)"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release firmata
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testStandardDebugUnitTest assembleStandardRelease assembleCompletoRelease \
            assemblePlayRelease bundlePlayRelease

      - name: APK + update.json (standard e completo)
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          # Deve essere firmato con la chiave di SemplicePhone (impronta del certificato release).
          EXPECTED=3871cf5b478aea297ec9aa665cebc98f7e62d9076fab62a548bac70e10f8819e
          for ED in standard completo; do
            if [ "$ED" = standard ]; then APK="SemplicePhone-$VERSION.apk"; JSON=update.json; NAME="$VERSION";
            else APK="SemplicePhone-completo-$VERSION.apk"; JSON=update-completo.json; NAME="$VERSION-completo"; fi
            cp "app/build/outputs/apk/$ED/release/app-$ED-release.apk" "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > certs.txt
            grep -E "certificate (DN|SHA-256)" certs.txt || true
            tr -d ': ' < certs.txt | tr 'A-F' 'a-f' | grep -q "$EXPECTED" || { echo "::error::$APK non firmato con la chiave attesa"; exit 1; }
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            CODE=$("$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2" dump badging "$APK" | grep -oP "versionCode='\K[0-9]+")
            printf '{"versionCode": %s, "versionName": "%s",\n "apkUrl": "https://github.com/%s/releases/download/%s/%s",\n "sha256": "%s"}\n' \
              "$CODE" "$NAME" "${{ github.repository }}" "$TAG" "$APK" "$SHA" > "$JSON"
            cat "$JSON"
          done
          # Il manifest della standard non deve contenere i permessi che Play Protect blocca.
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump permissions "SemplicePhone-$VERSION.apk" > perms.txt; cat perms.txt
          if grep -Eq "RECEIVE_SMS|REQUEST_INSTALL_PACKAGES|BIND_NOTIFICATION_LISTENER" perms.txt; then echo "::error::permessi bloccati nella standard"; exit 1; fi
          "$AAPT" dump xmltree --file AndroidManifest.xml "SemplicePhone-$VERSION.apk" | grep -q BIND_NOTIFICATION_LISTENER_SERVICE && { echo "::error::listener nella standard"; exit 1; } || true
          # Edizione Play: in più niente invio di SMS né USE_EXACT_ALARM (policy di Google Play).
          "$AAPT" dump permissions app/build/outputs/apk/play/release/app-play-release.apk > perms-play.txt; cat perms-play.txt
          if grep -Eq "SMS|REQUEST_INSTALL_PACKAGES|BIND_NOTIFICATION_LISTENER|USE_EXACT_ALARM" perms-play.txt; then echo "::error::permessi non ammessi nell'edizione Play"; exit 1; fi
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "SemplicePhone-play-$VERSION.aab"

      - name: Verifica riproducibilità (come F-Droid)
        run: |
          pip install --quiet --break-system-packages apksigcopier 2>/dev/null || pip install --quiet apksigcopier
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1):$PATH"   # apksigner
          # Copia la firma del nostro APK su quello compilato altrove: se sono identici, la verifica passa.
          apksigcopier compare --unsigned "SemplicePhone-completo-$VERSION.apk" "$RUNNER_TEMP/repro-unsigned.apk" \
            && echo "Riproducibile: F-Droid può pubblicare l'APK con la nostra firma" \
            || { echo "::error::build non riproducibile"; unzip -l "$RUNNER_TEMP/repro-unsigned.apk" > a.txt; unzip -l "SemplicePhone-completo-$VERSION.apk" > b.txt; diff a.txt b.txt | head -40; exit 1; }

      - name: Portale con la versione della release
        run: |
          sed -E "s/^const VERSION = '[^']*';.*/const VERSION = '$VERSION';/" tools/remote-server/index.php > index.php
          grep -q "const VERSION = '$VERSION';" index.php || { echo "::error::versione portale non aggiornata"; exit 1; }
          php -l index.php 2>/dev/null || true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copie a nome fisso: .../releases/latest/download/SemplicePhone.apk punta sempre all'ultima.
          cp "SemplicePhone-$VERSION.apk" SemplicePhone.apk
          cp "SemplicePhone-completo-$VERSION.apk" SemplicePhone-completo.apk
          gh release create "$TAG" "SemplicePhone-$VERSION.apk" "SemplicePhone-completo-$VERSION.apk" \
            SemplicePhone.apk SemplicePhone-completo.apk update.json update-completo.json index.php \
            "SemplicePhone-play-$VERSION.aab" \
            --target "$GITHUB_SHA" --title "SemplicePhone $TAG" --generate-notes

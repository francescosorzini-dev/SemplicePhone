name: release

# Tag vX.Y.Z → APK release firmato + update.json pubblicati come GitHub Release.
# Secrets richiesti: SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# (vedi tools/release/new-keystore.ps1).
on:
  push:
    tags: ['v*']
  # Avvio manuale (anche via API): il tag viene creato da GitHub insieme alla Release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione, es. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versione e tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "::error::versione non valida: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret SIGNING_KEYSTORE_B64 mancante (tools/release/new-keystore.ps1)"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release firmata
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}0"

      - name: APK + update.json
        run: |
          set -euo pipefail
          APK="SemplicePhone-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" > certs.txt
          cat certs.txt
          # Deve essere firmato con la chiave di SemplicePhone (impronta del certificato release).
          EXPECTED=3871cf5b478aea297ec9aa665cebc98f7e62d9076fab62a548bac70e10f8819e
          tr -d ': ' < certs.txt | tr 'A-F' 'a-f' | grep -q "$EXPECTED" || { echo "::error::APK non firmato con la chiave attesa"; exit 1; }
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > update.json <<EOF
          {"versionCode": ${{ github.run_number }}0, "versionName": "$VERSION",
           "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK",
           "sha256": "$SHA"}
          EOF
          cat update.json
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copia a nome fisso: .../releases/latest/download/SemplicePhone.apk punta sempre all'ultima.
          cp "$APK" SemplicePhone.apk
          gh release create "$TAG" "$APK" SemplicePhone.apk update.json --target "$GITHUB_SHA" --title "SemplicePhone $TAG" --generate-notes

name: fetch-fonts

# Una tantum: scarica Atkinson Hyperlegible (OFL) da google/fonts e lo committa in res/font.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download TTF + licenza
        run: |
          set -euo pipefail
          base=https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          curl -fsSL "$base/AtkinsonHyperlegible-Regular.ttf" -o app/src/main/res/font/atkinson_regular.ttf
          curl -fsSL "$base/AtkinsonHyperlegible-Bold.ttf" -o app/src/main/res/font/atkinson_bold.ttf
          curl -fsSL "$base/OFL.txt" -o app/src/main/assets/licenses/AtkinsonHyperlegible-OFL.txt
          for f in app/src/main/res/font/*.ttf; do
            file "$f" | grep -qi "truetype\|opentype" || { echo "$f non è un font"; exit 1; }
          done
          ls -la app/src/main/res/font

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/font app/src/main/assets/licenses
          git diff --cached --quiet && { echo "nessuna modifica"; exit 0; }
          git commit -m "Font Atkinson Hyperlegible (OFL) da google/fonts"
          git push
